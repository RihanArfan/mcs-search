name: Update installers
on:
  schedule:
    - cron: "0 3 * * 0" # weekly, Sunday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-installers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "26"
          cache: true

      - name: Run installers:update task
        run: |
          vp run dev > dev.log 2>&1 &
          # Retries until the server is up, then blocks until the scrape finishes
          curl --fail --retry 60 --retry-delay 2 --retry-connrefused --max-time 1500 \
            -X POST http://localhost:3000/_nitro/tasks/installers:update \
            || { cat dev.log; exit 1; }

      - name: Sanity check
        # Fail if the scrape was incomplete (fewer installers than the API reported)
        run: jq -e '.count == .reportedTotal' public/installers.meta.json

      - name: Commit changes
        run: |
          # updatedAt always changes, so only commit if the installer data did
          git diff --quiet public/installers.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/installers.json public/installers.meta.json
          git commit -m "chore: update installers data"
          git push
